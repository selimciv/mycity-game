<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mapbox GL JS + Phaser 3</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <!-- Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 1;
        }

        #game-container {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Allow clicks to pass through to map where transparent */
        /* If you want Phaser to capture input, you might need to adjust pointer-events or specific regions */
    </style>
</head>

<body>

    <style>
        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            height: 200px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 10;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            list-style-type: none;
            padding: 0;
            margin: 0;
            margin-bottom: 10px;
        }

        #chat-messages li {
            margin-bottom: 5px;
            word-wrap: break-word;
        }

        #chat-input-area {
            display: flex;
        }

        #chat-input {
            flex-grow: 1;
            padding: 5px;
            border: none;
            border-radius: 4px;
        }

        #chat-send {
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            margin-left: 5px;
            cursor: pointer;
        }

        #auth-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            /* Dark background covering game */
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #auth-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
        }

        #auth-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
        }

        #auth-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        #auth-box button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #auth-box button:hover {
            background-color: #0056b3;
        }

        .toggle-link {
            margin-top: 15px;
            font-size: 14px;
            color: #007bff;
            cursor: pointer;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        /* --- HUD PANEL (Step 21) --- */
        #hud-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 260px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 2px solid #00ffff;
            border-radius: 10px;
            box-shadow: 0 0 15px #00ffff, inset 0 0 10px rgba(0, 255, 255, 0.2);
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            z-index: 1000;
            pointer-events: none;
            /* Tıklamalar geçsin */
            backdrop-filter: blur(5px);
            text-shadow: 0 0 5px #00ffff;
        }

        #hud-panel div {
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        #hud-panel div:last-child {
            margin-bottom: 0;
        }
    </style>

    <!-- HUD Panel (Initially Hidden) -->
    <div id="hud-panel" style="display: none;">
        <div>Bakiye: <span id="hud-balance">0</span> 💎</div>
        <div>Konum: <span id="hud-location">0.00, 0.00</span></div>
        <div>Bölge: İnegöl Merkez</div>
    </div>

    <div id="auth-overlay">
        <!-- Giriş Formu -->
        <div id="login-form-container" class="auth-section">
            <div id="auth-box">
                <h2>Giriş Yap</h2>
                <input type="email" id="login-email" placeholder="E-posta" />
                <input type="password" id="login-password" placeholder="Şifre" />
                <button id="login-btn">Giriş Yap</button>
                <div class="toggle-link" id="show-register">Hesabın yok mu? Kayıt Ol</div>
            </div>
        </div>

        <!-- Kayıt Formu (Başlangıçta Gizli) -->
        <div id="register-form-container" class="auth-section hidden">
            <div id="auth-box">
                <h2>Kayıt Ol</h2>
                <input type="email" id="reg-email" placeholder="E-posta" />
                <input type="password" id="reg-password" placeholder="Şifre" />
                <button id="reg-btn">Kayıt Ol</button>
                <div class="toggle-link" id="show-login">Zaten hesabın var mı? Giriş Yap</div>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <div id="game-container"></div>

    <div id="chat-container">
        <ul id="chat-messages"></ul>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Mesaj yaz..." />
            <button id="chat-send">Gönder</button>
        </div>
    </div>

    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Three.js (3D Engine) -->
    <script src="https://unpkg.com/three@0.126.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // --- Mapbox Setup ---
        // TO DO: Replace with your actual Mapbox access token
        mapboxgl.accessToken = 'pk.eyJ1Ijoic2VsaW1jaXYiLCJhIjoiY21pdDBqYXJnMDFpejNkcjF4eTJmanN2dCJ9.nilqpcebhdTJ4mESbRdOCQ';

        // LocalStorage'dan son konumu al (veya varsayılan İnegöl)
        const SAVED_LAT = parseFloat(localStorage.getItem('myCity_lat')) || 40.0789;
        const SAVED_LON = parseFloat(localStorage.getItem('myCity_lon')) || 29.5133;

        const map = new mapboxgl.Map({
            container: 'map', // container ID
            style: 'mapbox://styles/mapbox/streets-v12', // style URL
            center: [SAVED_LON, SAVED_LAT], // [lng, lat]
            zoom: 18,
            pitch: 65,
            bearing: -17.6,
            keyboard: false // Kılavye kontrolünü kapat
        });
        window.map = map;

        // --- 3D Custom Layer (Three.js) ---
        const customLayer = {
            id: '3d-model',
            type: 'custom',
            renderingMode: '3d',
            modelTransform: null,
            scene: null,
            camera: null,
            renderer: null,
            droneMesh: null,
            map: null,

            onAdd: function (map, gl) {
                this.map = map;
                this.camera = new THREE.Camera();
                this.scene = new THREE.Scene();

                // Işıklandırma - Daha belirgin ışık
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                this.scene.add(ambientLight);

                // Yönlü ışık (Gölge ve derinlik için)
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(50, -50, 100).normalize();
                this.scene.add(directionalLight);

                // İkinci ışık (Dolgu)
                const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
                directionalLight2.position.set(-50, 50, 100).normalize();
                this.scene.add(directionalLight2);

                // --- SQUARE BOX / CUBE ---
                // BoxGeometry: Width, Height, Depth (2x2x2)
                const geometry = new THREE.BoxGeometry(2, 2, 2);

                // Daha iyi materyal (StandardMaterial)
                const material = new THREE.MeshStandardMaterial({
                    color: 0x0088FF, // Mavi
                    roughness: 0.5,
                    metalness: 0.1,
                });

                this.prism = new THREE.Mesh(geometry, material);

                // Kenar Çizgileri (Edges) - Flat görünümü engellemek için
                const edges = new THREE.EdgesGeometry(geometry);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
                this.prism.add(line); // Küpün içine ekle

                // ThreeJS Box Y ekseninde uzanır.
                // Mapbox Z yukarıdır.
                // Dik durması için X'te 90 döndür.
                this.prism.rotation.x = Math.PI / 2;

                // Pivotu tabana al (Yükseklik 2, yarısı 1)
                geometry.translate(0, 1, 0);
                edges.translate(0, 1, 0); // Çizgileri de ötele

                this.scene.add(this.prism);

                this.renderer = new THREE.WebGLRenderer({
                    canvas: map.getCanvas(),
                    context: gl,
                    antialias: true
                });
                this.renderer.autoClear = false;
            },

            updatePosition: function (lat, lon, angle) {
                const altitude = 0;
                const mercator = mapboxgl.MercatorCoordinate.fromLngLat([lon, lat], altitude);
                const unitsPerMeter = mercator.meterInMercatorCoordinateUnits();

                // HEDEF BOYUT: 4 Metre (Daha görünür olması için büyüttük)
                const targetSize = 4;

                // Model Geometry = 2 birim.
                // Scale katsayısı
                const scaleInMercator = (targetSize / 2) * unitsPerMeter;

                this.modelParams = {
                    x: mercator.x,
                    y: mercator.y,
                    z: mercator.z,
                    scale: scaleInMercator
                };
            },

            render: function (gl, matrix) {
                if (!this.modelParams) return;

                // 1. Mapbox View-Projection Matrisi
                const m = new THREE.Matrix4().fromArray(matrix);

                // 2. Model Matrisi (Translation & Scale)
                // Kaydırma ve Ölçeklemeyi CPU tarafında (64-bit float) matrise ekliyoruz.
                // Bu sayede GPU'da (32-bit) precision kaybı ve titreme (jitter) olmuyor.
                const l = new THREE.Matrix4()
                    .makeTranslation(this.modelParams.x, this.modelParams.y, this.modelParams.z)
                    .scale(new THREE.Vector3(this.modelParams.scale, this.modelParams.scale, this.modelParams.scale));

                // 3. Projeksiyon Matrisini Güncelle
                this.camera.projectionMatrix = m.multiply(l);

                this.renderer.resetState();
                this.renderer.render(this.scene, this.camera);
                this.map.triggerRepaint();
            }
        };

        map.on('load', () => {
            console.log('Mapbox map loaded');

            // 3D Binalar Katmanı (Mapbox Standard)
            map.addLayer({
                'id': '3d-buildings',
                'source': 'composite',
                'source-layer': 'building',
                'filter': ['==', 'extrude', 'true'],
                'type': 'fill-extrusion',
                'minzoom': 15,
                'paint': {
                    'fill-extrusion-color': [
                        'case',
                        ['!=', ['feature-state', 'color'], null],
                        ['feature-state', 'color'],
                        '#aaa' // Varsayılan renk (Gri)
                    ],

                    // Yükseklik verisini 'height' özelliğinden al
                    'fill-extrusion-height': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        15,
                        0,
                        15.05,
                        ['get', 'height']
                    ],
                    // Zemin yüksekliğini 'min_height' özelliğinden al
                    'fill-extrusion-base': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        15,
                        0,
                        15.05,
                        ['get', 'min_height']
                    ],
                    'fill-extrusion-opacity': 0.6
                }
            });

            // 3D Model Katmanını Ekle
            map.addLayer(customLayer);

            // Tıklama Olayı (Raycasting)
            map.on('click', (e) => {
                // Tıklanan noktadaki özellikleri sorgula (Sadece '3d-buildings' katmanı)
                const features = map.queryRenderedFeatures(e.point, {
                    layers: ['3d-buildings']
                });

                // Eğer bir binaya tıklandıysa
                if (features.length > 0) {
                    const feature = features[0];
                    const coordinates = e.lngLat;

                    // Binanın özelliklerini al
                    const buildingId = feature.id || Math.floor(Math.random() * 1000000).toString(); // Ensure string if needed

                    // Popup İçeriği
                    const popupContent = `
                        <div style="text-align: center;">
                            <h3>Bina Detayı</h3>
                            <p><b>Bina ID:</b> ${buildingId}</p>
                            <p><b>Fiyat:</b> 10 (Test)</p>
                            <button id="btn-buy-${buildingId}" style="background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Satın Al</button>
                        </div>
                    `;

                    // Popup Oluştur ve Göster
                    const popup = new mapboxgl.Popup()
                        .setLngLat(coordinates)
                        .setHTML(popupContent)
                        .addTo(map);

                    // Butona tıklama olayını ekle (Popup DOM'a eklendikten sonra)
                    // Mapbox popup içeriği string olduğu için, elemente erişmek için biraz beklemek veya global fonksiyon kullanmak gerekir.
                    // En temizi:
                    setTimeout(() => {
                        const btn = document.getElementById(`btn-buy-${buildingId}`);
                        if (btn) {
                            btn.onclick = () => window.buyBuilding(buildingId, coordinates.lat, coordinates.lng, popup);
                        }
                    }, 100);
                }
            });

            // Satın Alma Fonksiyonu (Global)
            window.buyBuilding = function (buildingId, lat, lon, popup) {
                // Kullanıcı ID'sini al (Test için 1 veya localStorage)
                // Not: Gerçek uygulamada login sonrası token/id saklanmalı.
                // Burada login başarısından sonra DB ID'si localStorage'a kaydedilmeliydi, ama şimdilik auth flow'a tam bağlı değiliz.
                // Varsayılan olarak 1 (eğer yoksa) deneyelim ama login olduysak result.dbId'yi kullanmalıyız.
                // Login koduna bakalım... startGame(result.dbId) çağrılıyor.
                // window.currentUserId değişkeni atayalım startGame içinde.

                const userId = window.currentUserId || 1; // Fallback 1

                fetch('/api/satin-al', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, buildingId, lat, lon })
                })
                    .then(res => res.json().then(data => ({ status: res.status, body: data })))
                    .then(result => {
                        if (result.status === 200) {
                            alert(result.body.mesaj + "\nYeni Bakiye: " + result.body.yeniBakiye);
                            if (popup) popup.remove();
                        } else {
                            alert("Hata: " + result.body.mesaj);
                        }
                    })
                    .catch(err => {
                        console.error('Satın alma hatası:', err);
                        alert('Bir hata oluştu.');
                    });
            };
        });

        // --- Phaser Setup ---
        // --- Phaser Setup ---
        class MainScene extends Phaser.Scene {
            constructor() {
                super({ key: 'MainScene' });
                this.socket = null;
            }

            preload() {
                this.load.setBaseURL('./'); // Local assets
                this.load.image('drone', 'drone.png');

                // --- SES EFEKTLERİ (Step 21) ---
                this.load.audio('pickup', 'https://raw.githubusercontent.com/photonstorm/phaser3-examples/master/public/assets/audio/SoundEffects/key.wav');
                this.load.audio('buy', 'https://raw.githubusercontent.com/photonstorm/phaser3-examples/master/public/assets/audio/SoundEffects/p-ping.mp3');
                this.load.audio('chat', 'https://raw.githubusercontent.com/photonstorm/phaser3-examples/master/public/assets/audio/SoundEffects/lazer.wav');
            }

            create() {
                console.log('Phaser scene created');
                const self = this;

                // Başlangıç Koordinatları (Kaydedilen)
                this.playerLat = SAVED_LAT;
                this.playerLon = SAVED_LON;

                // --- OYUNCU (Drone) ---
                // Arkada çalışan, görünmeyen fizik objesi.
                // 3D Model bunun Lat/Lon konumunu takip eder.
                this.player = this.physics.add.sprite(0, 0, 'drone');
                this.player.setVisible(false); // Gizle (Sadece 3D model görünsün)
                this.player.setCollideWorldBounds(true);
                this.player.setScale(0.05); // Fizik hitbox için küçük kalsın
                // World bounds kapatılabilir çünkü harita geziliyor, ama şimdilik kalsın
                // this.player.setCollideWorldBounds(true); 

                // Konumu Periyodik Olarak Kaydet (1 saniyede bir)
                this.time.addEvent({
                    delay: 1000,
                    loop: true,
                    callback: () => {
                        if (self.playerLat && self.playerLon) {
                            localStorage.setItem('myCity_lat', self.playerLat);
                            localStorage.setItem('myCity_lon', self.playerLon);
                        }
                    }
                });

                // İsim Etiketi
                this.playerNameTag = this.add.text(0, -30, 'Ben', {
                    fontSize: '14px',
                    fill: '#00FFFF',
                    stroke: '#000000',
                    strokeThickness: 3,
                    fontFamily: 'Arial'
                }).setOrigin(0.5);

                // Alternatif Süzülme (Tween yerine)
                this.bobOffset = 0;

                // Diğer Gruplar
                this.otherPlayers = this.add.group();
                this.crystals = this.add.group();

                this.cursors = this.input.keyboard.createCursorKeys();

                this.debugText = this.add.text(10, 10, 'Giriş bekleniyor...', { font: '16px Courier', fill: '#00ff00', backgroundColor: '#000000' });

                this.bakiyeText = this.add.text(10, 30, 'Bakiye: - TL', {
                    font: '20px Arial',
                    fill: '#FFD700',
                    backgroundColor: '#000000',
                    padding: { x: 5, y: 5 }
                });
                this.bakiyeText.setScrollFactor(0);

                this.physics.add.overlap(this.player, this.crystals, (player, crystal) => {
                    this.handleCrystalCollection(player, crystal);
                });

                // --- SES OBJELERİ ---
                this.sfx = {
                    pickup: this.sound.add('pickup'),
                    buy: this.sound.add('buy'),
                    chat: this.sound.add('chat', { volume: 0.5 })
                };

                // --- OYUN BAŞLATMA ---

                window.startGame = (userId) => {
                    // Oyuna başlarken kamerayı kesinlikle karaktere odakla
                    if (this.playerLat && this.playerLon) {
                        map.flyTo({ center: [this.playerLon, this.playerLat], zoom: 18 });
                    }

                    // Show HUD
                    const hud = document.getElementById('hud-panel');
                    if (hud) hud.style.display = 'block';

                    // Kamerayı bağla
                    self.cameraLocked = true;
                    this.connectSocket(userId);
                };
            }

            update(time, delta) {
                if (!this.player || !this.socket) return;
                // Harita yüklendi mi?
                if (!map || !map.getStyle()) return;

                // 1. Mevcut Lat/Lon'u ekrana yansıt (Geo-Lock)
                // Bu her karede çalışır, böylece zoom/pan yapınca karakter kaymaz.
                const projectedPos = map.project([this.playerLon, this.playerLat]);

                // --- HUD GÜNCELLEME (Step 21) ---
                const locEl = document.getElementById('hud-location');
                if (locEl) locEl.innerText = `${this.playerLat.toFixed(5)}, ${this.playerLon.toFixed(5)}`;

                // Anti-Gravity Bobbing (Manuel)
                this.bobOffset = Math.sin(time / 200) * 5; // +/- 5px

                // Sprite Konumunu Güncelle
                this.player.x = projectedPos.x;
                this.player.y = projectedPos.y + this.bobOffset; // Süzülme efektif

                // 3D Model Konumunu Güncelle
                if (typeof customLayer !== 'undefined') {
                    // Angle düzeltmesi: Phaser 0 derece = Sağ (Doğu).
                    // Three.js cone yukarı bakıyor (veya ileri).
                    // Deneme yanılma ile gerekirse offset ekle.
                    customLayer.updatePosition(this.playerLat, this.playerLon, this.player.angle);
                }

                // --- Dinamik Ölçeklendirme (World Size) ---
                // Zoom seviyesine göre boyutu ayarla, böylece "zoom out" yapınca dev gibi kalmaz.
                const currentZoom = map.getZoom();
                // Referans: Zoom 18'de Scale 0.05
                const targetScale = 0.05 * Math.pow(2, currentZoom - 18);
                this.player.setScale(targetScale);

                // Diğer oyuncuları da ölçekle VE Pozisyonlarını Güncelle
                this.otherPlayers.getChildren().forEach(container => {
                    // 1. Ölçekleme
                    const sprite = container.list[0];
                    if (sprite) sprite.setScale(targetScale);

                    // 2. Pozisyon Güncelleme (Reprojection)
                    if (container.lat && container.lon) {
                        const point = map.project([container.lon, container.lat]);
                        container.setPosition(point.x, point.y);
                    }
                });

                // --- FİZİK GÜNCELLEMESİ (SABİT DÜNYA HIZI) ---
                const SPEED_METERS_PER_SEC = 50; // Saniyede 50 metre (Şehir ölçeği için hızlı)
                const currentMercator = mapboxgl.MercatorCoordinate.fromLngLat([this.playerLon, this.playerLat]);
                // meterInMercatorCoordinateUnits değerini loglardan anladığımız kadarıyla 'Units per Meter' gibi davranıyor (veya tersi).
                // Log: değeri ~3e-8. Bu çok küçük.
                // Eğer bu "1 Unit kaç metre" olsaydı 40.000.000 olurdu.
                // Demek ki bu "1 Metre kaç Unit".
                // O yüzden Metre'yi Unit'e çevirmek için ÇARPACAĞIZ. 
                const unitsPerMeter = currentMercator.meterInMercatorCoordinateUnits();

                // delta milisaniye cinsinden. Saniyeye çevir: delta/1000
                const moveMeters = SPEED_METERS_PER_SEC * (delta / 1000);

                // Kaç Mercator ünitesi gideceğiz? (Meters * UnitsPerMeter)
                const moveMercator = moveMeters * unitsPerMeter;

                let moved = false;
                let dx = 0;
                let dy = 0;

                if (this.cursors.left.isDown) dx = -1;
                else if (this.cursors.right.isDown) dx = 1;

                if (this.cursors.up.isDown) dy = -1; // Mercator Y = 0 (Kuzey) -> 1 (Güney). Yani Yukarı tuşu Y azaltmalı.
                else if (this.cursors.down.isDown) dy = 1;

                if (dx !== 0 || dy !== 0) {
                    // Normalize
                    if (dx !== 0 && dy !== 0) {
                        dx *= 0.707;
                        dy *= 0.707;
                    }

                    // Yeni Mercator Pozisyonu
                    const nextMercX = currentMercator.x + (dx * moveMercator);
                    const nextMercY = currentMercator.y + (dy * moveMercator);

                    // Clamp (Dünya sınırları 0-1)
                    if (nextMercX < 0 || nextMercX > 1 || nextMercY < 0 || nextMercY > 1) return;

                    // Mercator -> LngLat Çevirimi
                    const nextLL = new mapboxgl.MercatorCoordinate(nextMercX, nextMercY, 0).toLngLat();

                    this.playerLon = nextLL.lng;
                    this.playerLat = nextLL.lat;
                    moved = true;

                    // Açı Hesabı
                    let angle = 0;
                    if (dx < 0) angle = -180;
                    if (dx > 0) angle = 0;
                    if (dy < 0) {
                        if (dx < 0) angle = -135;
                        else if (dx > 0) angle = -45;
                        else angle = -90;
                    } else if (dy > 0) {
                        if (dx < 0) angle = 135;
                        else if (dx > 0) angle = 45;
                        else angle = 90;
                    }
                    this.player.setAngle(angle);

                    if (moved) {
                        this.moved = true; // Global flag update
                        // Geo-Lock: Harita merkezini karakterde tut
                        // NOT: 'zoom' parametresini kaldırdık. Kullanıcı zoom yapabilsin, biz sadece konumu takip edelim.
                        map.jumpTo({ center: [this.playerLon, this.playerLat], animate: false });
                    }
                    // else if KALDIRILDI: Oyuncu dururken haritayı zorla merkeze çekme.
                    // Bu sayede kullanıcı dururken rahatça zoom/pan yapabilir ve titreme olmaz.     // Sunucuya Bildir
                    this.socket.emit('oyuncuHareketi', {
                        x: 0, // Sprite X/Y artık önemsiz
                        y: 0,
                        lat: this.playerLat,
                        lon: this.playerLon,
                        angle: this.player.angle
                    });
                }
                this.playerNameTag.x = this.player.x;
                this.playerNameTag.y = this.player.y - 30;

                this.crystals.getChildren().forEach(c => {
                    if (c.lat && c.lon) {
                        const point = map.project([c.lon, c.lat]);
                        c.setPosition(point.x, point.y);
                    }
                });
            }

            connectSocket(userId) {
                const self = this;
                window.currentUserId = userId;
                console.log("Socket bağlanıyor... UserId:", userId);

                this.socket = io({
                    query: { userId: userId },
                    transports: ['websocket']
                });
                window.socket = this.socket;

                this.socket.on('connect', () => {
                    console.log('Sunucuya Bağlaşıldı!');
                    self.debugText.setText('ID: ' + self.socket.id);
                    self.playerNameTag.setText(userId); // Kendi ismimizi ID yapalım

                    // En yakın yola ışınlan
                    self.spawnOnNearestRoad();
                });

                // === OYUNCU EVENTLERİ ===
                this.socket.on('mevcutOyuncular', (players) => {
                    Object.keys(players).forEach((id) => {
                        if (id !== self.socket.id) {
                            self.addOtherPlayer(players[id]);
                        }
                    });
                });

                this.socket.on('yeniOyuncu', (playerInfo) => {
                    self.addOtherPlayer(playerInfo);
                    self.debugText.setText('Yeni Oyuncu: ' + playerInfo.playerId);
                });

                this.socket.on('playerMoved', (pInfo) => {
                    self.otherPlayers.getChildren().forEach((otherContainer) => {
                        if (pInfo.playerId === otherContainer.playerId) {
                            // Lat/Lon Güncelle
                            if (pInfo.lat && pInfo.lon) {
                                otherContainer.lat = pInfo.lat;
                                otherContainer.lon = pInfo.lon;
                            }

                            // Hemen pozisyonunu da güncelle
                            if (otherContainer.lat && otherContainer.lon) {
                                const point = map.project([otherContainer.lon, otherContainer.lat]);
                                otherContainer.setPosition(point.x, point.y);
                            }

                            // Sprite döndür
                            const sprite = otherContainer.list[0];
                            if (sprite && pInfo.angle !== undefined) {
                                sprite.setAngle(pInfo.angle);
                            }
                        }
                    });
                });

                this.socket.on('oyuncuAyrildi', (playerId) => {
                    self.otherPlayers.getChildren().forEach((other) => {
                        if (playerId === other.playerId) {
                            other.destroy();
                        }
                    });
                });

                // === MÜLK EVENTLERİ ===
                this.socket.on('mulkSatinAlindi', (data) => {
                    if (data.mulkId) {
                        try {
                            map.setFeatureState(
                                { source: 'composite', sourceLayer: 'building', id: data.mulkId },
                                { color: '#00FF00' }
                            );
                        } catch (e) { }
                    }

                    // Ses Çal
                    self.sfx.buy.play();
                });

                this.socket.on('bakiyeGuncellendi', (yeniBakiye) => {
                    // Phaser Text Update
                    self.bakiyeText.setText(`Bakiye: ${yeniBakiye} TL`);

                    // HUD Update
                    const balEl = document.getElementById('hud-balance');
                    if (balEl) balEl.innerText = yeniBakiye;

                    // Ses Çal (Eğer oyun başladıysa ve bakiye değiştiyse)
                    // Basitçe: Her güncellemede 'pickup' sesi çalabiliriz ama başlangıçta da çalıyor.
                    // Bunu engellemek için bu listener'ın içine basit bir check koyamayız çünkü state yok.
                    // Ama 'bakiyeText' içeriği '- TL' değilse çal diyebiliriz.
                    if (self.bakiyeText.text !== 'Bakiye: - TL') {
                        self.sfx.pickup.play();
                    }
                });

                this.socket.on('mevcutKristaller', (serverCrystals) => {
                    Object.values(serverCrystals).forEach(c => self.addCrystal(c));
                });
                this.socket.on('yeniKristal', (c) => self.addCrystal(c));
                this.socket.on('kristalYokOldu', (id) => {
                    self.crystals.getChildren().forEach(c => { if (c.id === id) c.destroy(); });
                });
                this.socket.on('yeniMesaj', (data) => {
                    const li = document.createElement('li');
                    li.textContent = `${data.senderId.substr(0, 5)}: ${data.text}`;
                    document.getElementById('chat-messages').appendChild(li);

                    // Ses Çal
                    self.sfx.chat.play();
                });
            }

            addOtherPlayer(playerInfo) {
                // Konum hesapla
                let startX = playerInfo.x;
                let startY = playerInfo.y;

                if (playerInfo.lat && playerInfo.lon) {
                    const point = map.project([playerInfo.lon, playerInfo.lat]);
                    startX = point.x;
                    startY = point.y;
                }

                const container = this.add.container(startX, startY);
                container.playerId = playerInfo.playerId;
                container.lat = playerInfo.lat;
                container.lon = playerInfo.lon;

                // 1. Sprite
                const sprite = this.add.sprite(0, 0, 'drone');
                sprite.setScale(0.05);

                // Anti-Gravity diğer oyuncular için
                this.tweens.add({
                    targets: sprite,
                    y: '+=5',
                    duration: 1500,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut',
                    delay: Math.random() * 1000 // Rastgele gecikme ile hepsi aynı anda oynamasın
                });

                // 2. İsim Etiketi
                const nameTag = this.add.text(0, -30, playerInfo.playerId.substr(0, 5), {
                    fontSize: '12px',
                    fill: '#FFFF00', // Sarı renk
                    stroke: '#000000',
                    strokeThickness: 2,
                    fontFamily: 'Arial'
                }).setOrigin(0.5);

                container.add([sprite, nameTag]);
                this.otherPlayers.add(container);
            }

            addCrystal(cData) {
                const crystal = this.add.circle(0, 0, 10, 0x00ffff);
                crystal.id = cData.id;
                crystal.lat = cData.lat; // Veriyi sakla
                crystal.lon = cData.lon;

                this.tweens.add({
                    targets: crystal,
                    alpha: 0.5,
                    scale: 1.2, // Biraz da büyüsün
                    duration: 800,
                    yoyo: true,
                    repeat: -1
                });

                this.physics.add.existing(crystal);
                this.crystals.add(crystal);
            }

            handleCrystalCollection(player, crystal) {
                if (crystal.isCollecting) return;
                crystal.isCollecting = true;

                console.log("Kristal toplandı:", crystal.id);
                // Efekt
                const text = this.add.text(player.x, player.y - 40, '+50 Coin', {
                    fontSize: '24px',
                    color: '#00FF00',
                    stroke: '#000000', strokeThickness: 4
                }).setOrigin(0.5);

                this.tweens.add({
                    targets: text, y: player.y - 100, alpha: 0, duration: 2000,
                    onComplete: () => text.destroy()
                });

                this.socket.emit('kristalToplandi', crystal.id);
                crystal.destroy();
            }

            spawnOnNearestRoad() {
                const startX = this.player.x;
                const startY = this.player.y;
                let found = false;
                let radius = 10;
                const maxRadius = 500; // 500 piksel öteye kadar ara
                const step = 20;

                console.log("En yakın yol aranıyor...");

                // Basit Spiral Arama (Performans için optimize edilebilir)
                // Merkezden dışa doğru
                if (this.isPositionOnRoad(startX, startY)) {
                    console.log("Zaten yoldayız.");
                    return;
                }

                while (radius < maxRadius && !found) {
                    for (let angle = 0; angle < 360; angle += 45) {
                        const rad = Phaser.Math.DegToRad(angle);
                        const testX = startX + Math.cos(rad) * radius;
                        const testY = startY + Math.sin(rad) * radius;

                        if (this.isPositionOnRoad(testX, testY)) {
                            console.log(`Yol bulundu! Mesafe: ${radius}px`);

                            // Haritayı bu noktaya kaydır (Böylece karakter o yola ışınlanmış gibi olur)
                            const newCenter = map.unproject([testX, testY]);
                            map.jumpTo({ center: newCenter, animate: false });
                            
                            // Update local lat/lon state
                            this.playerLat = newCenter.lat;
                            this.playerLon = newCenter.lng;

                            found = true;
                            // Sunucuya yeni konumu bildir (Lat/Lon ile!)
                            if (this.socket) {
                                this.socket.emit('oyuncuHareketi', { 
                                    x: 0, 
                                    y: 0, 
                                    lat: this.playerLat, 
                                    lon: this.playerLon,
                                    angle: this.player.angle 
                                });
                            }
                            break;
                        }
                    }
                    radius += step;
                }

                if (!found) console.log("Yakınlarda yol bulunamadı.");
            }

            isPositionOnRoad(x, y) {
                const point = map.project(map.unproject([x, y])); // Garanti olsun
                const features = map.queryRenderedFeatures([point.x, point.y]);

                return features.some(f => {
                    const id = f.layer.id.toLowerCase();
                    // Daha kapsamlı anahtar kelimeler
                    return id.includes('road') ||
                        id.includes('bridge') ||
                        id.includes('tunnel') ||
                        id.includes('path') ||
                        id.includes('pedestrian') ||
                        id.includes('intersection') ||
                        id.includes('crossing') ||
                        id.includes('transit') ||
                        id.includes('walking') ||
                        id.includes('pavement') ||
                        id.includes('steps');
                });
            }
        }

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: window.innerWidth,
            height: window.innerHeight,
            transparent: true,
            scene: [MainScene],
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 }, // 2D oyun için yerçekimi 0 olmalı
                    debug: false
                }
            }
        };

        const game = new Phaser.Game(config);

        window.addEventListener('resize', () => {
            game.scale.resize(window.innerWidth, window.innerHeight);
        });

        // --- Kimlik Doğrulama Mantığı (Auth Logic) ---
        const authOverlay = document.getElementById('auth-overlay');
        const loginContainer = document.getElementById('login-form-container');
        const registerContainer = document.getElementById('register-form-container');

        const showRegisterBtn = document.getElementById('show-register');
        const showLoginBtn = document.getElementById('show-login');

        const loginBtn = document.getElementById('login-btn');
        const regBtn = document.getElementById('reg-btn');

        // Form Geçişleri
        showRegisterBtn.addEventListener('click', () => {
            loginContainer.classList.add('hidden');
            registerContainer.classList.remove('hidden');
        });

        showLoginBtn.addEventListener('click', () => {
            registerContainer.classList.add('hidden');
            loginContainer.classList.remove('hidden');
        });

        // Yardımcı Fonksiyon: İstek Gönderme
        async function sendAuthRequest(url, data) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.mesaj || 'İşlem başarısız');
                return result;
            } catch (error) {
                throw error;
            }
        }

        // Giriş Yapma
        loginBtn.addEventListener('click', async () => {
            const eposta = document.getElementById('login-email').value;
            const sifre = document.getElementById('login-password').value;

            try {
                const result = await sendAuthRequest('/giris', { eposta, sifre });
                console.log('Giriş Başarılı:', result);

                // Başarılı giriş sonrası paneli gizle ve oyunu aç
                authOverlay.style.display = 'none';

                // OYUNU BAŞLAT (Socket Bağlan)
                startGame(result.dbId);

            } catch (error) {
                console.error('Giriş Hatası:', error.message);
                alert('Giriş Başarısız: ' + error.message);
            }
        });

        // Kayıt Olma
        regBtn.addEventListener('click', async () => {
            const eposta = document.getElementById('reg-email').value;
            const sifre = document.getElementById('reg-password').value;

            try {
                const result = await sendAuthRequest('/kayit', { eposta, sifre });
                console.log('Kayıt Başarılı:', result);
                alert('Kayıt Başarılı! Şimdi giriş yapabilirsiniz.');

                // Otomatik olarak giriş ekranına yönlendir
                registerContainer.classList.add('hidden');
                loginContainer.classList.remove('hidden');

            } catch (error) {
                console.error('Kayıt Hatası:', error.message);
                alert('Kayıt Hatası: ' + error.message);
            }
        });

        // Chat UI Setup (Global scope or inside separate script, keeping it simple here)
        const chatInput = document.getElementById('chat-input');
        const chatSendBtn = document.getElementById('chat-send');
        const chatMessages = document.getElementById('chat-messages');

        function sendChat() {
            const text = chatInput.value;
            if (text.trim() !== "" && window.socket) {
                window.socket.emit('sohbetMesaji', text);
                chatInput.value = "";
            }
        }

        chatSendBtn.addEventListener('click', sendChat);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChat();
        });
    </script>

</body>
